title: feagent — Documentazione
description: feagent — libreria FEM per travi 3D (Euler-Bernoulli/Timoshenko): sezioni variabili, termica, precompressione, analisi modale, casi di studio. Documentazione pubblica.
remote_theme: just-the-docs/just-the-docs
baseurl: "/feagent-docs"
url: "https://domenicogaudioso.github.io"

# Required so GitHub Pages processes `remote_theme` (just-the-docs).
plugins:
  - jekyll-remote-theme

color_scheme: light

search_enabled: true

aux_links:
  "GitHub (repo privata)":
    - "https://github.com/DomenicoGaudioso/feagent"
  "Sito personale":
    - "https://domenicogaudioso.github.io/DomenicoGaudioso/"

footer_content: >-
  feagent — documentazione tecnica pubblica. License: PolyForm Noncommercial 1.0.0.
  Built by Domenico Gaudioso.

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
